<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HyperTrace report</title>
<script>try{var t=localStorage.getItem('hypertrace-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{
	--bg:#f4f4f6;--panel:#ffffff;--panel-2:#f0f0f4;--text:#1b1c22;--text-2:#4a4c57;--muted:#6e7080;--line:#e2e2e8;--line-2:#d2d2da;
	--accent:#2f6fde;--accent-soft:rgba(47,111,222,.12);--hot:#e0533c;--hot-soft:rgba(224,83,60,.12);--warn:#c98a12;--good:#2e9e5b;
	--skript:#e8912d;--save:#7b6cf2;--code:#f6f6f9;--shadow:0 1px 2px rgba(20,20,40,.05),0 6px 20px -12px rgba(20,20,40,.25);
	--tok-kw:#b4400f;--tok-str:#3f7d10;--tok-num:#9a5d00;--tok-com:#9196a0;--tok-var:#0c7a72;--tok-fn:#2f6fde;
	--seg-1:#2f6fde;--seg-2:#e0533c;--seg-3:#e8912d;--seg-4:#2e9e5b;--seg-5:#7b6cf2;--seg-6:#8a8d99;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
	--bg:#131418;--panel:#1c1d23;--panel-2:#22232b;--text:#e8e8ee;--text-2:#b7b8c3;--muted:#8d8f9c;--line:#2c2d36;--line-2:#3a3b46;
	--accent:#6f9cf0;--accent-soft:rgba(111,156,240,.14);--hot:#f0705c;--hot-soft:rgba(240,112,92,.14);--warn:#f0b54a;--good:#5cc98a;
	--skript:#f0a54a;--save:#9d91ff;--code:#17181d;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);
	--tok-kw:#ffab70;--tok-str:#b5d98a;--tok-num:#ffc66b;--tok-com:#6b6f7a;--tok-var:#7fd3da;--tok-fn:#8fb4ff;
	--seg-1:#6f9cf0;--seg-2:#f0705c;--seg-3:#f0a54a;--seg-4:#5cc98a;--seg-5:#9d91ff;--seg-6:#8d8f9c;
}}
:root[data-theme="dark"]{
	--bg:#131418;--panel:#1c1d23;--panel-2:#22232b;--text:#e8e8ee;--text-2:#b7b8c3;--muted:#8d8f9c;--line:#2c2d36;--line-2:#3a3b46;
	--accent:#6f9cf0;--accent-soft:rgba(111,156,240,.14);--hot:#f0705c;--hot-soft:rgba(240,112,92,.14);--warn:#f0b54a;--good:#5cc98a;
	--skript:#f0a54a;--save:#9d91ff;--code:#17181d;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);
	--tok-kw:#ffab70;--tok-str:#b5d98a;--tok-num:#ffc66b;--tok-com:#6b6f7a;--tok-var:#7fd3da;--tok-fn:#8fb4ff;
	--seg-1:#6f9cf0;--seg-2:#f0705c;--seg-3:#f0a54a;--seg-4:#5cc98a;--seg-5:#9d91ff;--seg-6:#8d8f9c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code,pre,.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:0 16px 56px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.badge.spike{background:var(--hot-soft);color:var(--hot)}
.sub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.search{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;width:240px;max-width:100%;color:var(--text)}
.iconbtn{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
nav.sections{display:flex;gap:4px;flex-wrap:wrap;padding:8px 0 0}
nav.sections a{font-size:12.5px;color:var(--text-2);padding:3px 8px;border-radius:6px}
nav.sections a:hover{background:var(--panel-2);text-decoration:none}
.warn{margin:14px 0 0;padding:10px 14px;border-radius:10px;background:var(--hot-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--hot) 35%,transparent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.card .val{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.card .val small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.card .foot{color:var(--muted);font-size:12.5px}
.card.crit .val{color:var(--hot)}
.card.good .val{color:var(--good)}
h2{font-size:18px;margin:34px 0 4px;letter-spacing:-.01em}
h2 .count{color:var(--muted);font-weight:500;font-size:14px;margin-left:6px}
p.desc{color:var(--muted);margin:0 0 10px;max-width:980px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
ol.findings{margin:0;padding:12px 16px 12px 36px}
ol.findings li{margin:5px 0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
.grid3 .panel{padding:14px 16px}
.panel h3{margin:0 0 2px;font-size:14px}
.panel .hint{color:var(--muted);font-size:12px;margin-bottom:8px}
.donut-box{display:flex;gap:14px;align-items:center}
.donut{position:relative;width:150px;height:150px;flex:none}
.donut svg{width:150px;height:150px}
.donut path{cursor:pointer;transition:transform .12s}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut .center b{font-size:18px}
.donut .center span{color:var(--muted);font-size:11.5px}
ul.legend{list-style:none;margin:0;padding:0;min-width:0;flex:1}
ul.legend li{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:6px;cursor:pointer;font-size:12.5px}
ul.legend li:hover,ul.legend li.on{background:var(--panel-2)}
ul.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
ul.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.legend .pc{color:var(--muted);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;font-size:12px}
.seg button{background:none;border:0;padding:3px 9px;cursor:pointer;color:var(--text-2)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.hist{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}
.hist .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:default}
.hist .bar{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.hist .bar.over{background:var(--hot)}
.hist .n{font-size:11px;color:var(--muted);margin-bottom:2px;font-variant-numeric:tabular-nums}
.hist-labels{display:flex;gap:6px;margin-top:4px}
.hist-labels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.pcts{display:flex;gap:14px;margin-top:10px;font-size:12.5px;flex-wrap:wrap}
.pcts b{color:var(--muted);font-weight:500;margin-right:4px}
.worst-hero{display:flex;align-items:baseline;gap:10px}
.worst-hero .big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.worst-hero .budget{color:var(--hot);font-weight:600}
.worst-nav{display:flex;gap:6px;align-items:center;margin-left:auto}
.worst-list{margin-top:8px}
.worst-row{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.worst-row:last-child{border-bottom:0}
.worst-row .r{color:var(--muted);width:14px}
.worst-row .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.worst-row .v{font-variant-numeric:tabular-nums;font-weight:600}
.chart-panel{padding:12px 14px;margin-top:6px}
.chart-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.chart-legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
#chart{width:100%;height:260px;display:block;margin-top:8px;touch-action:none;cursor:crosshair;user-select:none}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:12.5px}
.stats span b{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.stats span div{font-variant-numeric:tabular-nums;font-weight:600}
.table-box{margin-top:6px}
.tbl-wrap{overflow-x:auto;border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:12.5px;color:var(--text-2);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--accent)}
th.sorted::after{content:" ▾";color:var(--accent)}
th.sorted.asc::after{content:" ▴"}
td{font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.code{min-width:240px}
td.code code{white-space:pre-wrap;word-break:break-word;font-size:12.5px}
tbody tr:hover{background:var(--panel-2)}
tr.hidden-row,tr.filtered{display:none}
.tbl-foot{display:flex;gap:10px;align-items:center;padding:8px 12px;color:var(--muted);font-size:12.5px}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.linkbtn:hover{text-decoration:underline}
.heat{display:inline-block;width:56px;height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden;vertical-align:middle;margin-right:6px}
.heat i{display:block;height:100%;background:var(--hot)}
.why{color:var(--hot);font-size:12.5px}
.dim{color:var(--muted)}
.loc{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;white-space:nowrap}
svg.spark{width:96px;height:24px;display:block}
svg.spark polygon{fill:var(--accent-soft)}
svg.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.3;vector-effect:non-scaling-stroke}
.run{color:var(--good);font-weight:600}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;background:var(--panel-2);color:var(--text-2)}
.var-stats{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:12px 14px}
.var-stats span b{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.var-stats span div{font-size:18px;font-weight:700}
.saves{padding:0 14px 12px}
.save-row{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.save-row i{width:9px;height:9px;border-radius:50%;background:var(--save);flex:none}
pre.hang{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:12px;margin:8px 0}
footer{margin-top:44px;color:var(--muted);font-size:12.5px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:var(--shadow);max-width:380px;display:none}
#tip .t{font-weight:600;margin-bottom:2px}
#tip .r{display:flex;gap:10px;justify-content:space-between}
#tip .r span:last-child{font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(10,10,20,.5);display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;width:min(1180px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
.modal-head{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal-head .ttl{font-family:ui-monospace,Consolas,monospace;font-weight:600}
.modal-hot{padding:8px 16px;border-bottom:1px solid var(--line);max-height:30vh;overflow:auto}
.modal-hot h4{margin:2px 0 4px;font-size:12.5px;color:var(--muted);font-weight:600}
.hot-row{display:grid;grid-template-columns:52px 120px 1fr auto;gap:10px;align-items:center;font-size:12.5px;padding:2px 0;cursor:pointer}
.hot-row:hover{background:var(--panel-2)}
.hot-row .ln{color:var(--accent);text-align:right;font-family:ui-monospace,Consolas,monospace}
.hot-row .bar{height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.hot-row .bar i{display:block;height:100%;background:var(--hot)}
.hot-row .cd{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Consolas,monospace}
.hot-row .st{color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.modal-body{overflow:auto;flex:1;background:var(--code)}
.src{width:100%;border-collapse:collapse;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.src td{border:0;padding:0 10px;vertical-align:top}
.src td.n{color:var(--muted);text-align:right;user-select:none;width:1%;padding-left:12px}
.src td.c{white-space:pre;width:100%}
.src td.s{color:var(--muted);text-align:right;white-space:nowrap;width:1%;font-size:11.5px}
.src tr.hit td.s{color:var(--text)}
.src tr.hit{background:linear-gradient(90deg,color-mix(in srgb,var(--hot) var(--heat),transparent) 0 4px,color-mix(in srgb,var(--hot) calc(var(--heat) * .3),transparent) 4px)}
.src tr.focus{outline:2px solid var(--accent);outline-offset:-2px}
.src tr.flash{animation:flash 1s}
@keyframes flash{from{background:var(--accent-soft)}}
.tok-kw{color:var(--tok-kw)}.tok-str{color:var(--tok-str)}.tok-num{color:var(--tok-num)}.tok-com{color:var(--tok-com);font-style:italic}.tok-var{color:var(--tok-var)}
.fn{color:var(--tok-fn);text-decoration:underline dotted;cursor:pointer}
.modal-foot{padding:8px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap}
kbd{border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
#fnPreview{position:fixed;z-index:70;display:none;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);width:min(520px,90vw);font-size:12px;pointer-events:none}
#fnPreview .h{padding:6px 10px;border-bottom:1px solid var(--line);font-weight:600}
#fnPreview pre{margin:0;padding:8px 10px;white-space:pre;overflow:hidden;background:var(--code);border-radius:0 0 10px 10px}
.empty{color:var(--muted);padding:14px}
@media (max-width:700px){.search{width:100%}.donut-box{flex-direction:column;align-items:flex-start}#chart{height:200px}.hot-row{grid-template-columns:40px 60px 1fr}.hot-row .st{display:none}}
@media print{header.top{position:static}.modal-bg{display:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
	<div class="brand">Hyper<span>Trace</span></div>
	<span class="badge" id="kind"></span>
	<span class="sub" id="subtitle"></span>
	<span class="spacer"></span>
	<input class="search" id="search" type="search" placeholder="Filter by script, trigger or code…" aria-label="Filter tables">
	<button class="iconbtn" id="theme" title="Switch light / dark">◐ Theme</button>
</div>
<div class="wrap"><nav class="sections" id="nav"></nav></div></header>
<main class="wrap" id="main"></main>
<div id="tip"></div>
<div id="fnPreview"></div>
<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true">
	<div class="modal-head"><span class="ttl" id="mTitle"></span><span class="dim" id="mSub"></span><span class="spacer"></span><button class="iconbtn" id="mClose">Close <kbd>Esc</kbd></button></div>
	<div class="modal-hot" id="mHot"></div>
	<div class="modal-body" id="mBody"></div>
	<div class="modal-foot" id="mFoot"></div>
</div></div>
<script>window.HT = /*HYPERTRACE_DATA*/null;</script>
<script>
(function () {
	'use strict';
	var D = window.HT;
	var main = document.getElementById('main');
	if (!D) { main.innerHTML = '<p class="empty">No report data.</p>'; return; }

	// ---------- helpers ----------
	function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
	function fmtInt(n) { return Math.round(n).toLocaleString('en-US'); }
	function ms(ns) { var v = ns / 1e6; return (v >= 100 ? v.toFixed(0) : v >= 1 ? v.toFixed(2) : v.toFixed(3)) + ' ms'; }
	function msv(v) { return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + ' ms'; }
	function us(ns) { var u = ns / 1e3; if (u >= 1000) return ms(ns); return (u >= 10 ? u.toFixed(0) : u.toFixed(1)) + ' µs'; }
	function num(v) { return v >= 100 ? fmtInt(v) : v >= 10 ? v.toFixed(1) : v.toFixed(2); }
	function pct(v) { return (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + '%'; }
	function bytes(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : b >= 1024 ? (b / 1024).toFixed(0) + ' KB' : b + ' B'; }
	var ticks = Math.max(0, D.ticks || 0);
	function perTick(ns) { return ticks ? ns / ticks : ns; }
	var skriptNs = D.skriptNs || 0;
	function share(ns) { return skriptNs ? 100 * ns / skriptNs : 0; }
	function heat(p) { return '<span class="heat"><i style="width:' + Math.min(100, p).toFixed(1) + '%"></i></span>'; }
	function loc(script, line) {
		var text = esc(script) + (line > 0 ? ':' + line : '');
		return '<a class="loc" data-script="' + esc(script) + '" data-line="' + (line || 0) + '">' + text + '</a>';
	}
	function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
	var tipEl = document.getElementById('tip');
	function showTip(e, html) { tipEl.innerHTML = html; tipEl.style.display = 'block'; moveTip(e); }
	function moveTip(e) {
		var x = e.clientX + 14, y = e.clientY + 14, r = tipEl.getBoundingClientRect();
		if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
		if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
		tipEl.style.left = Math.max(4, x) + 'px'; tipEl.style.top = Math.max(4, y) + 'px';
	}
	function hideTip() { tipEl.style.display = 'none'; }

	var triggers = D.triggers || [], lines = D.lines || [], events = D.events || [];
	var functions = triggers.filter(function (t) { return t.kind === 'function'; });
	var others = triggers.filter(function (t) { return t.kind !== 'function'; });
	var fnByName = {};
	functions.forEach(function (f) { fnByName[f.name.replace(/^function /, '').toLowerCase()] = f; });
	var linesByScript = {};
	lines.forEach(function (l) { (linesByScript[l.script] = linesByScript[l.script] || {})[l.line] = l; });
	var tickMs = D.tickMs || [], tickSk = D.tickSkriptMs || [], tickVars = D.tickVariableWrites || [];
	var stored = tickMs.length;

	// activity: flat [tick, units of 100 ns, runs, ...], sorted by tick
	function activityFrom(act, tick) {
		var lo = 0, hi = act.length / 3;
		while (lo < hi) { var mid = (lo + hi) >> 1; if (act[mid * 3] < tick) lo = mid + 1; else hi = mid; }
		return lo * 3;
	}
	function rangeSum(t, a, b) {
		var act = t.activity || [], s = 0, runs = 0;
		for (var i = activityFrom(act, a); i < act.length && act[i] <= b; i += 3) { s += act[i + 1] * 100; runs += act[i + 2]; }
		return [s, runs];
	}
	function spark(t, a, b) {
		var act = t.activity || [];
		if (!act.length || b <= a) return '';
		var bins = 40, w = 96, h = 24, sums = new Array(bins).fill(0), span = b - a + 1, max = 0;
		for (var i = activityFrom(act, a); i < act.length && act[i] <= b; i += 3) {
			var k = Math.min(bins - 1, Math.floor((act[i] - a) / span * bins)); sums[k] += act[i + 1];
		}

				cfg.cols.forEach(function (c) { out.push('<td class="' + (c.num ? 'num ' : '') + (c.cls || '') + '">' + c.html(r) + '</td>'); });

		t.state.key = rangeState.key; t.state.dir = rangeState.dir; t.render();
		rangeBox.querySelector('#rangeTable').addEventListener('click', function () { rangeState.key = t.state.key; rangeState.dir = t.state.dir; });
		rangeRender = t.render;
	}
	var rangeRender = null;
	searchEl.addEventListener('input', function () { if (rangeRender) rangeRender(); });
	function applyView(lo, hi) {
		viewLo = Math.max(0, lo); viewHi = Math.min(stored - 1, hi);
		resetBtn.style.display = viewLo === 0 && viewHi === stored - 1 ? 'none' : '';
		drawChart(); viewStats(); renderRange();
	}
	function zoomTo(tick) { var pad = 100; applyView(Math.max(0, tick - pad), Math.min(stored - 1, tick + pad)); document.getElementById('ticks').scrollIntoView({behavior: 'smooth'}); }
	resetBtn.addEventListener('click', function () { applyView(0, stored - 1); });
	chart.addEventListener('pointerdown', function (e) {
		if (!stored || e.button > 0) return;
		chart.setPointerCapture(e.pointerId);
		drag = tOf(e.clientX);
		hideTip();
	});
	chart.addEventListener('pointermove', function (e) {
		if (!stored) return;
		var t = tOf(e.clientX);
		if (drag != null) {
			var a = Math.min(drag, t), b = Math.max(drag, t);
			sel.setAttribute('x', xOf(a).toFixed(1)); sel.setAttribute('width', Math.max(1, xOf(b) - xOf(a)).toFixed(1));
			return;
		}
		var cur = chart.querySelector('#cursor');
		if (cur) { cur.setAttribute('x1', xOf(t)); cur.setAttribute('x2', xOf(t)); cur.setAttribute('stroke-opacity', '.6'); }
		var top = [];
		triggers.forEach(function (tr) { var act = tr.activity || [], i = activityFrom(act, t); if (i < act.length && act[i] === t) top.push([tr, act[i + 1] * 100, act[i + 2]]); });
		top.sort(function (a, b) { return b[1] - a[1]; });
		var h = '<div class="t">Tick #' + fmtInt(t + 1) + ' · ' + (t / 20).toFixed(2) + ' s</div><div class="r"><span>Whole tick</span><span>' + msv(tickMs[t] || 0) + '</span></div><div class="r"><span>Skript</span><span>' + msv(tickSk[t] || 0) + '</span></div>';
		if (tickVars[t]) h += '<div class="r"><span>Variable writes</span><span>' + fmtInt(tickVars[t]) + '</span></div>';
		top.slice(0, 4).forEach(function (x) { h += '<div class="r"><span class="dim">' + esc(x[0].name.slice(0, 40)) + (x[2] > 1 ? ' ×' + x[2] : '') + '</span><span>' + ms(x[1]) + '</span></div>'; });
		if (top.length > 4) h += '<div class="dim">+ ' + (top.length - 4) + ' more</div>';
		showTip(e, h);
	});
	chart.addEventListener('pointerleave', function () { hideTip(); var cur = chart.querySelector('#cursor'); if (cur) cur.setAttribute('stroke-opacity', '0'); });
	function endDrag(e) {
		if (drag == null) return;
		var t = tOf(e.clientX), a = Math.min(drag, t), b = Math.max(drag, t);
		drag = null;
		if (b - a >= 2) applyView(a, b); else if (sel) sel.setAttribute('width', 0);
	}
	chart.addEventListener('pointerup', endDrag);
	chart.addEventListener('pointercancel', function () { drag = null; if (sel) sel.setAttribute('width', 0); });
	chart.addEventListener('dblclick', function () { applyView(0, stored - 1); });
	var resizeTimer;
	addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawChart, 120); });
	applyView(0, stored - 1);

	// ---------- script viewer ----------
	var modalBg = document.getElementById('modalBg'), mTitle = document.getElementById('mTitle'), mSub = document.getElementById('mSub'), mHot = document.getElementById('mHot'), mBody = document.getElementById('mBody'), mFoot = document.getElementById('mFoot');
	var KEYWORDS = /^(on|if|else|set|send|cancel|broadcast|command|trigger|every|wait|stop|loop|while|add|remove|delete|clear|give|teleport|to|of|is|are|isn't|aren't|not|or|and|in|true|false|then|return|function|options|variables|execute|make|spawn|create|open|close|at|for|from|with|as|parse|parsed|contains|exit|continue|send|message|reset|play|apply|all|any)$/i;
	function highlight(text) {
		var out = '', i = 0, n = text.length;
		while (i < n) {
			var c = text[i];
			if (c === '#') {
				var before = text.slice(0, i), quotes = (before.match(/"/g) || []).length;
				if (quotes % 2 === 0 && text[i + 1] !== '#') { out += '<span class="tok-com">' + esc(text.slice(i)) + '</span>'; break; }
			}
			if (c === '"') {
				var j = i + 1;
				while (j < n) { if (text[j] === '"') { if (text[j + 1] === '"') { j += 2; continue; } break; } j++; }
				out += '<span class="tok-str">' + esc(text.slice(i, j + 1)) + '</span>'; i = j + 1; continue;
			}
			if (c === '{') {
				var d = 1, k = i + 1;
				while (k < n && d > 0) { if (text[k] === '{') d++; else if (text[k] === '}') d--; k++; }
				out += '<span class="tok-var">' + esc(text.slice(i, k)) + '</span>'; i = k; continue;
			}
			if (/[0-9]/.test(c) && (i === 0 || !/[\w]/.test(text[i - 1]))) {
				var m = text.slice(i).match(/^\d+(\.\d+)?/);
				out += '<span class="tok-num">' + m[0] + '</span>'; i += m[0].length; continue;
			}
			if (/[A-Za-z_]/.test(c)) {
				var w = text.slice(i).match(/^[A-Za-z_][\w']*/)[0], after = text.slice(i + w.length);
				if (/^\s*\(/.test(after) && fnByName[w.toLowerCase()]) out += '<span class="fn" data-fn="' + esc(w.toLowerCase()) + '">' + esc(w) + '</span>';
				else if (KEYWORDS.test(w)) out += '<span class="tok-kw">' + esc(w) + '</span>';
				else out += esc(w);
				i += w.length; continue;
			}
			out += esc(c); i++;
		}
		return out;
	}
	function openScript(script, line, triggerIndex) {
		var source = (D.sources || {})[script], byLine = linesByScript[script] || {};
		var scriptLines = lines.filter(function (l) { return l.script === script; });
		var trig = triggerIndex != null ? triggers[triggerIndex] : null;
		var focusLines = trig ? lines.filter(function (l) { return triggers[l.trigger] === trig; }) : scriptLines;
		mTitle.textContent = script + (line > 0 ? ':' + line : '');
		var own = scriptLines.reduce(function (s, l) { return s + l.ownNs; }, 0);
		mSub.innerHTML = trig ? '· <code>' + esc(trig.name) + '</code>' : '· ' + ms(perTick(own)) + ' per tick · ' + pct(share(own)) + ' of Skript';
		var hot = focusLines.slice().sort(function (a, b) { return b.ownNs - a.ownNs; }).slice(0, 8), maxHot = hot.length ? hot[0].ownNs || 1 : 1;
		mHot.innerHTML = hot.length ? '<h4>Hottest lines' + (trig ? ' of this ' + (trig.kind === 'function' ? 'function' : 'trigger') : '') + ' (own time per tick)</h4>' + hot.map(function (l) {
			return '<div class="hot-row" data-line="' + l.line + '"><span class="ln">' + (l.line > 0 ? l.line : '–') + '</span><span class="bar"><i style="width:' + (100 * l.ownNs / maxHot).toFixed(1) + '%"></i></span><span class="cd">' + esc(l.code) + '</span><span class="st">' + ms(perTick(l.ownNs)) + ' · ×' + num(ticks ? l.calls / ticks : l.calls) + '/tick</span></div>';
		}).join('') : '<h4>No lines of this script ran during the capture.</h4>';
		var maxOwn = scriptLines.reduce(function (m, l) { return Math.max(m, l.ownNs); }, 1);
		if (source != null) {
			var src = source.split(/\r?\n/), rows = [];
			for (var i = 0; i < src.length; i++) {
				var n = i + 1, l = byLine[n], cls = l ? 'hit' : '', style = l ? ' style="--heat:' + (Math.sqrt(l.ownNs / maxOwn) * 100).toFixed(0) + '%"' : '';
				var stat = l ? ms(perTick(l.ownNs)) + ' · ×' + num(ticks ? l.calls / ticks : l.calls) + (l.section && l.blockNs ? ' · block ' + ms(perTick(l.blockNs)) : '') : '';
				var title = l ? ' title="' + esc('own ' + ms(perTick(l.ownNs)) + '/tick · total ' + ms(perTick(l.totalNs)) + '/tick · ' + fmtInt(l.calls) + ' runs · avg ' + us(l.totalNs / l.calls) + ' · slowest ' + ms(l.maxNs) + (l.why ? ' · ' + l.why : '')) + '"' : '';
				rows.push('<tr id="L' + n + '" class="' + cls + '"' + style + title + '><td class="n">' + n + '</td><td class="c">' + (highlight(src[i]) || ' ') + '</td><td class="s">' + stat + '</td></tr>');
			}
			mBody.innerHTML = '<table class="src">' + rows.join('') + '</table>';
		} else {
			mBody.innerHTML = '<div class="empty">The source of this script is not in the report (<code>report.include-sources</code> in hypertrace.yml, or the file was too large). Lines that ran:</div><table class="src">' + scriptLines.slice().sort(function (a, b) { return a.line - b.line; }).map(function (l) {
				return '<tr id="L' + l.line + '" class="hit" style="--heat:' + (Math.sqrt(l.ownNs / maxOwn) * 100).toFixed(0) + '%"><td class="n">' + l.line + '</td><td class="c">' + highlight(l.code) + '</td><td class="s">' + ms(perTick(l.ownNs)) + ' · ×' + num(ticks ? l.calls / ticks : l.calls) + '</td></tr>';
			}).join('') + '</table>';
		}
		mFoot.innerHTML = '<span>Lines are colored by their own time. Hover a line for details; hover a <span class="fn">function</span> call to preview it, click to open it.</span><span><kbd>Esc</kbd> to close</span>';
		modalBg.classList.add('open');
		document.body.style.overflow = 'hidden';
		var target = line > 0 ? mBody.querySelector('#L' + line) : (trig && trig.line > 0 ? mBody.querySelector('#L' + trig.line) : null);
		mBody.scrollTop = 0;
		if (target) { target.classList.add('focus'); requestAnimationFrame(function () { mBody.scrollTop = Math.max(0, target.offsetTop - 60); }); }
	}
	function closeModal() { modalBg.classList.remove('open'); document.body.style.overflow = ''; hideFn(); }
	document.getElementById('mClose').addEventListener('click', closeModal);
	modalBg.addEventListener('click', function (e) { if (e.target === modalBg) closeModal(); });
	addEventListener('keydown', function (e) { if (e.key === 'Escape' && modalBg.classList.contains('open')) closeModal(); });
	mHot.addEventListener('click', function (e) {
		var r = e.target.closest('.hot-row'); if (!r) return;
		var n = +r.getAttribute('data-line'), t = mBody.querySelector('#L' + n);
		if (t) { mBody.scrollTop = Math.max(0, t.offsetTop - 60); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
	});
	var fnPrev = document.getElementById('fnPreview');
	function hideFn() { fnPrev.style.display = 'none'; }
	document.addEventListener('mouseover', function (e) {
		var f = e.target.closest && e.target.closest('.fn[data-fn]'); if (!f) return;
		var fn = fnByName[f.getAttribute('data-fn')]; if (!fn) return;
		var src = (D.sources || {})[fn.script], body = '';
		if (src && fn.line > 0) body = src.split(/\r?\n/).slice(fn.line - 1, fn.line + 7).map(highlight).join('\n');
		fnPrev.innerHTML = '<div class="h">' + esc(fn.name) + ' · ' + esc(fn.script) + ':' + fn.line + ' · ' + fmtInt(fn.calls) + ' calls · ' + ms(perTick(fn.totalNs)) + '/tick</div>' + (body ? '<pre>' + body + '</pre>' : '');
		fnPrev.style.display = 'block';
		var r = f.getBoundingClientRect(), top = r.bottom + 6;
		if (top + fnPrev.offsetHeight > innerHeight - 8) top = r.top - fnPrev.offsetHeight - 6;
		fnPrev.style.left = Math.max(8, Math.min(r.left, innerWidth - fnPrev.offsetWidth - 8)) + 'px';
		fnPrev.style.top = Math.max(8, top) + 'px';
	});
	document.addEventListener('mouseout', function (e) { if (e.target.closest && e.target.closest('.fn[data-fn]')) hideFn(); });

	// ---------- global clicks ----------
	document.addEventListener('click', function (e) {
		var f = e.target.closest('.fn[data-fn]');
		if (f) { var fn = fnByName[f.getAttribute('data-fn')]; if (fn) { hideFn(); openScript(fn.script, fn.line, triggers.indexOf(fn)); } return; }
		var z = e.target.closest('[data-zoom]');
		if (z) { e.preventDefault(); if (modalBg.classList.contains('open')) closeModal(); zoomTo(+z.getAttribute('data-zoom')); return; }
		var a = e.target.closest('a.loc[data-script]');
		if (a) { e.preventDefault(); var s = a.getAttribute('data-script'), ln = +a.getAttribute('data-line'); var ti = null; triggers.forEach(function (t, i) { if (ti == null && t.script === s && t.line === ln) ti = i; }); openScript(s, ln, ti); return; }
		var li = e.target.closest('ul.legend li[data-script]');
		if (li) openScript(li.getAttribute('data-script'), 0);
	});

	// ---------- theme ----------
	document.getElementById('theme').addEventListener('click', function () {
		var root = document.documentElement, cur = root.getAttribute('data-theme');
		var dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
		var next = dark ? 'light' : 'dark';
		root.setAttribute('data-theme', next);
		try { localStorage.setItem('hypertrace-theme', next); } catch (err) { }
		drawChart();
	});
})();
</script>
